<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Owner sign in · Content Venture OS</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-wrap">
    <section class="card login-card">
      <p class="eyebrow">Private operating workspace</p>
      <h1>Owner sign in</h1>
      <p class="muted">Buyer funnels remain public. Venture controls, uploads, approvals and business evidence require this session.</p>
      <form id="login-form">
        <label>Username<input name="username" autocomplete="username" required autofocus></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button>Sign in</button>
      </form>
      <p id="login-message" role="alert"></p>
    </section>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
